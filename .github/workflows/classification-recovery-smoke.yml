name: Classification recovery PostgreSQL smoke

on:
  push:
    branches:
      - fix/d0-classification-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Execute classification lifecycle smoke
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -f server/classification/classificationMigrationSmoke.sql
