name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.scope.outputs.classification }}
      run_quality: ${{ steps.scope.outputs.run_quality }}
      run_expo_export: ${{ steps.scope.outputs.run_expo_export }}
      run_native: ${{ steps.scope.outputs.run_native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Classify changed files
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            node scripts/ci/ci-scope.mjs --force-native
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            node scripts/ci/ci-scope.mjs "$PR_BASE_SHA" "$PR_HEAD_SHA" --diff-mode=pull-request
          else
            node scripts/ci/ci-scope.mjs "$PUSH_BASE_SHA" "$PUSH_HEAD_SHA" --diff-mode=push
          fi

  quality:
    needs: classify
    if: needs.classify.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Export iOS, Android and web bundles
        if: needs.classify.outputs.run_expo_export == 'true'
        run: npx expo export --platform all

  android-native:
    needs: classify
    if: needs.classify.outputs.run_native == 'true'
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Compile Android debug APK (PR arm64)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Compile Android debug APK (main/release full ABI set)
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
