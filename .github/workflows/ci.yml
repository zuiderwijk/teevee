name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Bundle checks exercise native imports/worklets too; not a signed native build.
      - name: Export iOS, Android and web bundles
        run: npx expo export --platform all

  android-native:
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # PR scope detection compares the exact base/head commits.
          fetch-depth: 0

      - name: Determine Android native build scope
        id: native-scope
        shell: bash
        run: |
          set -euo pipefail

          # main remains the release-like safety net: build the complete ABI set.
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "Full Android native build required on ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          # Be conservative if GitHub ever yields an unexpected empty diff.
          if [[ -z "$changed_files" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "scope=arm64" >> "$GITHUB_OUTPUT"
            echo "Empty PR diff detected; running arm64 native build conservatively."
            exit 0
          fi

          # Documentation/design-source-only PRs cannot alter the runtime/native graph.
          # Root Markdown files (for example AGENTS.md) are documentation as well.
          runtime_files="$(printf '%s\n' "$changed_files" | grep -Ev '^(docs/|design/|[^/]+\.md$)' || true)"
          if [[ -z "$runtime_files" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "scope=docs-only" >> "$GITHUB_OUTPUT"
            echo "Documentation/design-only PR; skipping Android native compilation."
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "scope=arm64" >> "$GITHUB_OUTPUT"
          echo "Runtime/config change detected; building arm64-v8a for PR validation."

      - uses: actions/setup-node@v7
        if: steps.native-scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.native-scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.native-scope.outputs.run == 'true'
      - run: npm ci
        if: steps.native-scope.outputs.run == 'true'
      - name: Generate Android native project
        if: steps.native-scope.outputs.run == 'true'
        run: npx expo prebuild --platform android --clean
      - name: Compile Android debug APK (PR arm64)
        if: steps.native-scope.outputs.run == 'true' && github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Compile Android debug APK (main full ABI set)
        if: steps.native-scope.outputs.run == 'true' && github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
