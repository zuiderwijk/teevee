name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.scope.outputs.classification }}
      run_quality: ${{ steps.scope.outputs.run_quality }}
      run_expo_export: ${{ steps.scope.outputs.run_expo_export }}
      run_native: ${{ steps.scope.outputs.run_native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Classify changed files
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            node scripts/ci/ci-scope.mjs --force-native
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            node scripts/ci/ci-scope.mjs "$PR_BASE_SHA" "$PR_HEAD_SHA" --diff-mode=pull-request
          else
            node scripts/ci/ci-scope.mjs "$PUSH_BASE_SHA" "$PUSH_HEAD_SHA" --diff-mode=push
          fi

  quality:
    needs: classify
    if: needs.classify.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Export iOS, Android and web bundles
        if: needs.classify.outputs.run_expo_export == 'true'
        run: npx expo export --platform all

  guide-search-live-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/guide-search-deployment-closeout'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live channel Search
        env:
          GUIDE_SEARCH_URL: https://eokszvpityhtysbwdduy.supabase.co/functions/v1/guide-search
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data '{"query":"NPO"}' \
            "$GUIDE_SEARCH_URL")"
          RESPONSE="$response" node <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE);
          if (payload.status !== 'ok') throw new Error('channel Search status is not ok');
          if (!Array.isArray(payload.channelMatches) || payload.channelMatches.length === 0) {
            throw new Error('channel Search returned no channel matches');
          }
          if (!payload.channelMatches.some((channel) => channel.id === 'nl-npo-1')) {
            throw new Error('channel Search did not return canonical NPO 1');
          }
          if (!['complete', 'partial', 'unavailable'].includes(payload.programmeCoverage)) {
            throw new Error('channel Search returned invalid programme coverage');
          }
          NODE

      - name: Verify live programme Search
        env:
          GUIDE_SEARCH_URL: https://eokszvpityhtysbwdduy.supabase.co/functions/v1/guide-search
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data '{"query":"Goedemorgen Nederland"}' \
            "$GUIDE_SEARCH_URL")"
          RESPONSE="$response" node <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE);
          if (payload.status !== 'ok') throw new Error('programme Search status is not ok');
          if (!Array.isArray(payload.programmeMatches) || payload.programmeMatches.length === 0) {
            throw new Error('programme Search returned no programme matches');
          }
          const match = payload.programmeMatches.find(
            ({ programme, channel }) =>
              programme?.title === 'Goedemorgen Nederland' &&
              programme?.channelId === 'nl-npo-1' &&
              channel?.id === 'nl-npo-1',
          );
          if (!match) throw new Error('programme Search did not return the canonical NPO 1 broadcast');
          NODE

  android-native:
    needs: classify
    if: needs.classify.outputs.run_native == 'true'
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Verify Teevee exact-alarm module autolinking
        run: npx expo-modules-autolinking resolve --platform android | grep -Fq 'TeeveeExactAlarmModule'
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Verify Android exact-alarm permission
        run: grep -Fq 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
      - name: Compile Android debug APK (PR arm64)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Compile Android debug APK (main/release full ABI set)
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
