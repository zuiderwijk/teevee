name: External content identity source research

on:
  push:
    branches:
      - research/issue-153-external-content-identity
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe current XMLTV source
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import hashlib
          import io
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          URL = "https://iptv-epg.org/files/epg-nl.xml"
          ACTIVE = {
              "NPO1.nl","NPO2.nl","NPO3.nl","RTL4.nl","RTL5.nl","SBS6.nl",
              "RTL7.nl","RTL8.nl","Net5.nl","VeronicaDisneyXD.nl","SBS9.nl","RTLZ.nl"
          }
          EXPLICIT_SERIES = {"Dramaseries","Misdaaddrama","Sitcoms","Soap"}
          NONFICTION = {
              "Nieuws","Talkshow","Reality","Reality Competitie","Documentaire","Spelshow",
              "Actualiteitenprogramma's","Actualiteit","Interview","Sporttalkshow","Weer",
              "Entertainment","Consumentenprogramma's","Shoppen","Politiek","Samenleving"
          }

          req = urllib.request.Request(URL, headers={"User-Agent":"teevee-research/1.0"})
          with urllib.request.urlopen(req, timeout=60) as response:
              payload = response.read()
              headers = dict(response.headers.items())

          def txt(el):
              if el is None:
                  return None
              s = " ".join("".join(el.itertext()).split()).strip()
              return s or None

          def tagname(tag):
              return tag.rsplit("}",1)[-1]

          def date_shape(v):
              if not v: return "missing"
              if re.fullmatch(r"\d{4}", v): return "YYYY"
              if re.fullmatch(r"\d{8}", v): return "YYYYMMDD"
              if re.fullmatch(r"\d{4}-\d{2}-\d{2}", v): return "YYYY-MM-DD"
              return "other"

          def ep_shape(v):
              v=(v or "").strip()
              if re.search(r"\bS\d+\s*E\d+\b", v, re.I): return "Sx Ey"
              if re.fullmatch(r"S\d+", v, re.I): return "season-only"
              if re.fullmatch(r"E\d+", v, re.I): return "episode-only"
              if re.fullmatch(r"\d+\.\d+(?:\.\d+)?/?", v): return "numeric-dotted"
              return "other"

          coverage = collections.Counter()
          child_tags = collections.Counter()
          programme_attrs = collections.Counter()
          category_counts = collections.Counter()
          date_shapes = collections.Counter()
          date_values = collections.Counter()
          episode_systems = collections.Counter()
          episode_shapes = collections.Counter()
          credit_role_programmes = collections.Counter()
          credit_role_entries = collections.Counter()
          language_values = collections.Counter()
          country_values = collections.Counter()
          rating_values = collections.Counter()
          icon_hosts = collections.Counter()
          rows = []
          total = 0
          multi_categories = 0
          multi_episode_systems = 0
          explicit_se = 0
          season_only = 0
          credits_examples_nonfiction_actor = []

          for event, el in ET.iterparse(io.BytesIO(payload), events=("end",)):
              if tagname(el.tag) != "programme":
                  continue
              if el.attrib.get("channel") not in ACTIVE:
                  el.clear()
                  continue
              total += 1
              for k in el.attrib:
                  programme_attrs[k] += 1
              children = list(el)
              for c in children:
                  child_tags[tagname(c.tag)] += 1

              title = txt(el.find("title"))
              subtitle = txt(el.find("sub-title"))
              desc = txt(el.find("desc"))
              categories = [txt(x) for x in el.findall("category")]
              categories = [x for x in categories if x]
              eps = []
              for x in el.findall("episode-num"):
                  val=txt(x)
                  if val: eps.append({"system": x.attrib.get("system"), "value": val})
              date = txt(el.find("date"))
              country = txt(el.find("country"))
              language = txt(el.find("language"))
              icon = el.find("icon")
              icon_src = icon.attrib.get("src") if icon is not None else None
              rating = el.find("rating")
              rating_text = txt(rating.find("value")) if rating is not None else None
              credits = el.find("credits")
              roles = {}
              if credits is not None:
                  for c in list(credits):
                      role=tagname(c.tag)
                      name=txt(c)
                      if name:
                          roles.setdefault(role,[]).append(name)

              fields = {
                  "title": bool(title), "subtitle": bool(subtitle), "desc": bool(desc),
                  "categories": bool(categories), "episode-num": bool(eps), "date": bool(date),
                  "credits": credits is not None, "director": bool(roles.get("director")),
                  "actor": bool(roles.get("actor")), "producer": bool(roles.get("producer")),
                  "presenter": bool(roles.get("presenter")), "country": bool(country),
                  "language": bool(language), "rating": bool(rating_text),
                  "new": el.find("new") is not None, "premiere": el.find("premiere") is not None,
                  "previously-shown": el.find("previously-shown") is not None,
                  "live": el.find("live") is not None, "icon": bool(icon_src),
                  "programme-id-attribute": bool(el.attrib.get("id")),
              }
              for k,v in fields.items():
                  if v: coverage[k]+=1
              if len(categories)>1: multi_categories+=1
              category_counts.update(categories)
              if date:
                  date_shapes[date_shape(date)] += 1
                  date_values[date] += 1
              systems={e["system"] or "(none)" for e in eps}
              if len(systems)>1: multi_episode_systems += 1
              for e in eps:
                  episode_systems[e["system"] or "(none)"] += 1
                  episode_shapes[ep_shape(e["value"])] += 1
              has_se=any(re.search(r"\bS\d+\s*E\d+\b", e["value"], re.I) for e in eps)
              has_s_only=(not has_se and any(re.fullmatch(r"S\d+",e["value"],re.I) for e in eps))
              explicit_se += int(has_se)
              season_only += int(has_s_only)
              if credits is not None:
                  for role,names in roles.items():
                      credit_role_programmes[role]+=1
                      credit_role_entries[role]+=len(names)
              if language: language_values[language]+=1
              if country: country_values[country]+=1
              if rating_text: rating_values[rating_text]+=1
              if icon_src:
                  try: icon_hosts[urlparse(icon_src).netloc or "(relative)"] += 1
                  except Exception: icon_hosts["(invalid)"] += 1

              if roles.get("actor") and any(c in NONFICTION for c in categories) and len(credits_examples_nonfiction_actor)<25:
                  credits_examples_nonfiction_actor.append({
                      "title":title,"categories":categories,"actors":roles.get("actor",[])[:6],
                      "presenters":roles.get("presenter",[])[:6],"directors":roles.get("director",[])[:3]
                  })

              rows.append({
                  "channel":el.attrib.get("channel"),"start":el.attrib.get("start"),"stop":el.attrib.get("stop"),
                  "programme_id_attr":el.attrib.get("id"),"title":title,"subtitle":subtitle,
                  "desc":desc,"categories":categories,"episode":eps,"date":date,
                  "roles":roles,"country":country,"language":language,"rating":rating_text,
                  "icon":icon_src
              })
              el.clear()

          def pct(n): return round(100*n/total,2) if total else 0

          def subset_metrics(subset):
              n=len(subset)
              keys=["subtitle","desc","categories","episode","date","country","language","rating","icon"]
              out={"rows":n}
              for key in keys:
                  out[key]=round(100*sum(bool(r.get(key)) for r in subset)/n,2) if n else 0
              for role in ["director","actor","producer","presenter"]:
                  out[role]=round(100*sum(bool(r["roles"].get(role)) for r in subset)/n,2) if n else 0
              return out

          films=[r for r in rows if "Film" in r["categories"]]
          series=[r for r in rows if any(c in EXPLICIT_SERIES for c in r["categories"])]
          episodic=[r for r in rows if r["episode"]]

          title_years=collections.defaultdict(set)
          title_channels=collections.defaultdict(set)
          title_starts=collections.defaultdict(list)
          for r in rows:
              if r["title"]:
                  if r["date"]: title_years[r["title"]].add(r["date"])
                  title_channels[r["title"]].add(r["channel"])
                  title_starts[r["title"]].append(r["start"])
          multi_year_titles={k:sorted(v) for k,v in title_years.items() if len(v)>1}
          cross_channel_titles={k:sorted(v) for k,v in title_channels.items() if len(v)>1}

          rich_films=sorted(films,key=lambda r:(bool(r["date"])+bool(r["roles"].get("director"))+bool(r["roles"].get("actor"))+bool(r["subtitle"])),reverse=True)[:15]
          rich_series=sorted(series,key=lambda r:(bool(r["episode"])+bool(r["date"])+bool(r["roles"].get("actor"))+bool(r["subtitle"])),reverse=True)[:15]

          def sample_row(r):
              return {
                  "channel":r["channel"],"start":r["start"],"title":r["title"],"subtitle":r["subtitle"],
                  "categories":r["categories"],"date":r["date"],"episode":r["episode"],
                  "directors":r["roles"].get("director",[])[:3],"actors":r["roles"].get("actor",[])[:6],
                  "producers":r["roles"].get("producer",[])[:3],"presenters":r["roles"].get("presenter",[])[:3],
                  "country":r["country"],"language":r["language"],"rating":r["rating"],
                  "programme_id_attr":r["programme_id_attr"],"icon":r["icon"]
              }

          output={
              "snapshot":{
                  "url":URL,"bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest(),
                  "last_modified":headers.get("Last-Modified"),"etag":headers.get("ETag"),
                  "date_header":headers.get("Date")
              },
              "population":{"mapped_programmes":total,"active_channels":len(ACTIVE)},
              "programme_attributes":programme_attrs,
              "programme_child_tags":child_tags,
              "coverage":{k:{"count":coverage[k],"pct":pct(coverage[k])} for k in sorted(coverage)},
              "multi_category":{"count":multi_categories,"pct":pct(multi_categories)},
              "categories":{"unique":len(category_counts),"top":category_counts.most_common(80)},
              "date":{"shapes":date_shapes,"unique_values":len(date_values),"min":min(date_values) if date_values else None,"max":max(date_values) if date_values else None},
              "credits":{
                  "role_programme_coverage":{k:{"count":v,"pct":pct(v)} for k,v in credit_role_programmes.most_common()},
                  "role_entry_counts":credit_role_entries,
                  "nonfiction_actor_examples":credits_examples_nonfiction_actor
              },
              "episode":{
                  "systems":episode_systems,"shapes":episode_shapes,
                  "multi_system_programmes":multi_episode_systems,
                  "explicit_se_programmes":explicit_se,"season_only_programmes":season_only
              },
              "values":{
                  "language_top":language_values.most_common(20),"country_top":country_values.most_common(30),
                  "rating_top":rating_values.most_common(30),"icon_hosts":icon_hosts
              },
              "subset_coverage":{
                  "film_explicit":subset_metrics(films),
                  "series_explicit":subset_metrics(series),
                  "any_episode_num":subset_metrics(episodic)
              },
              "identity_collisions":{
                  "titles_with_multiple_date_values":dict(list(sorted(multi_year_titles.items()))[:50]),
                  "titles_seen_on_multiple_active_channels":dict(list(sorted(cross_channel_titles.items()))[:50]),
                  "multi_year_title_count":len(multi_year_titles),
                  "cross_channel_title_count":len(cross_channel_titles)
              },
              "film_samples":[sample_row(r) for r in rich_films],
              "series_samples":[sample_row(r) for r in rich_series]
          }
          print("TEEVE_EXTERNAL_IDENTITY_RESEARCH_JSON_BEGIN")
          print(json.dumps(output,ensure_ascii=False,indent=2,default=lambda x:dict(x)))
          print("TEEVE_EXTERNAL_IDENTITY_RESEARCH_JSON_END")
          PY
