name: Temporary Hosted EPG E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public guide transport runtime
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"from":"2026-09-16T00:00:00Z","to":"2026-09-17T00:00:00Z"}' \
            -o /tmp/guide-body.txt \
            -w '%{http_code}' \
            'https://eokszvpityhtysbwdduy.supabase.co/functions/v1/guide-schedule')
          echo "guide_http=$code"
          cat /tmp/guide-body.txt

      - name: Probe temporary ingest runtime
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            -X POST \
            -H 'x-teevee-e2e: phase3-canonical-v1' \
            -o /tmp/ingest-body.txt \
            -w '%{http_code}' \
            'https://eokszvpityhtysbwdduy.supabase.co/functions/v1/epg-feed-inspect')
          echo "ingest_http=$code"
          cat /tmp/ingest-body.txt
