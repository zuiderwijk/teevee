name: Temporary Seed Amsterdam Guide Days

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Probe today and tomorrow protected seed
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            -X POST \
            -H 'x-teevee-seed: amsterdam-days-v1' \
            'https://eokszvpityhtysbwdduy.supabase.co/functions/v1/epg-feed-inspect' \
            -o /tmp/seed.json \
            -w '%{http_code}')
          echo "http=$code"
          cat /tmp/seed.json

      - name: Probe current canonical day availability
        run: |
          set -euo pipefail
          for spec in \
            '2026-09-13T22:00:00.000Z 2026-09-14T22:00:00.000Z today' \
            '2026-09-14T22:00:00.000Z 2026-09-15T22:00:00.000Z tomorrow'
          do
            set -- $spec
            from=$1
            to=$2
            label=$3
            code=$(curl --silent --show-error \
              -X POST \
              -H 'Content-Type: application/json' \
              --data "{\"from\":\"$from\",\"to\":\"$to\"}" \
              'https://eokszvpityhtysbwdduy.supabase.co/functions/v1/guide-schedule' \
              -o "/tmp/$label.json" \
              -w '%{http_code}')
            echo "$label http=$code"
            cat "/tmp/$label.json"
          done
