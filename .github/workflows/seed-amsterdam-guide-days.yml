name: Temporary Seed Amsterdam Guide Days

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify seeded Amsterdam day reads
        run: |
          set -euo pipefail
          for spec in \
            '2026-09-13T22:00:00.000Z 2026-09-14T22:00:00.000Z today' \
            '2026-09-14T22:00:00.000Z 2026-09-15T22:00:00.000Z tomorrow'
          do
            set -- $spec
            from=$1
            to=$2
            label=$3
            curl --fail --silent --show-error \
              -X POST \
              -H 'Content-Type: application/json' \
              --data "{\"from\":\"$from\",\"to\":\"$to\"}" \
              -w '%{time_total} %{size_download}\n' \
              'https://eokszvpityhtysbwdduy.supabase.co/functions/v1/guide-schedule' \
              -o "/tmp/$label.json" > "/tmp/$label.metrics"
          done
          python - <<'PY'
          import json
          summary = {}
          for label in ('today', 'tomorrow'):
              data = json.load(open(f'/tmp/{label}.json'))
              assert data['status'] == 'ok', data
              schedule = data['schedule']
              assert schedule['timezone'] == 'Europe/Amsterdam', schedule
              assert len(schedule['channels']) == 12, schedule
              assert len(schedule['programmes']) > 0, schedule
              time_total, size_download = open(f'/tmp/{label}.metrics').read().split()
              summary[label] = {
                  'generatedAt': schedule['generatedAt'],
                  'channels': len(schedule['channels']),
                  'programmes': len(schedule['programmes']),
                  'seconds': time_total,
                  'bytes': int(size_download),
              }
          print(json.dumps(summary, indent=2))
          PY
