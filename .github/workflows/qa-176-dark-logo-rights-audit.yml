name: QA 176 dark-logo source pack

on:
  push:
    branches: [feat/issue-175-channel-expansion]
    paths: [.github/workflows/qa-176-dark-logo-rights-audit.yml]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package accepted base sources and official Ziggo dark marks
        run: |
          set -eux
          mkdir -p qa176-source-pack/base qa176-source-pack/ziggo
          for id in             nl-rtl-4 nl-rtl-5 nl-rtl-7 nl-rtl-8 nl-rtl-z             nl-comedy-central nl-discovery nl-eurosport-1 nl-eurosport-2             nl-national-geographic nl-viaplay-tv nl-star-channel
          do
            cp "assets/channels/$id.png" "qa176-source-pack/base/$id.png"
          done

          curl --fail --location --retry 3 'https://d21buns5ku92am.cloudfront.net/69874/images/638906-Ziggo%20Sport%20402%20White%20Horizontal%20RGB%20v1-3a54d1-original-1768301467.png?download=1' -o qa176-source-pack/ziggo/nl-ziggo-sport-2.png
          curl --fail --location --retry 3 'https://d21buns5ku92am.cloudfront.net/69874/images/638905-Ziggo%20Sport%20403%20White%20Horizontal%20RGB%20v1-2e3d9a-original-1768301467.png?download=1' -o qa176-source-pack/ziggo/nl-ziggo-sport-3.png
          curl --fail --location --retry 3 'https://d21buns5ku92am.cloudfront.net/69874/images/638904-Ziggo%20Sport%20404%20White%20Horizontal%20RGB%20v1-ce7552-original-1768301467.png?download=1' -o qa176-source-pack/ziggo/nl-ziggo-sport-4.png
          curl --fail --location --retry 3 'https://d21buns5ku92am.cloudfront.net/69874/images/638907-Ziggo%20Sport%20405%20White%20Horizontal%20RGB%20v1-8bf0fd-original-1768301467.png?download=1' -o qa176-source-pack/ziggo/nl-ziggo-sport-5.png
          curl --fail --location --retry 3 'https://d21buns5ku92am.cloudfront.net/69874/images/638909-Ziggo%20Sport%20406%20White%20Horizontal%20RGB%20v1-b1fefb-original-1768301467.png?download=1' -o qa176-source-pack/ziggo/nl-ziggo-sport-6.png

          sha256sum qa176-source-pack/base/*.png qa176-source-pack/ziggo/*.png > qa176-source-pack/SHA256SUMS
          file qa176-source-pack/base/*.png qa176-source-pack/ziggo/*.png > qa176-source-pack/file-types.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qa176-dark-logo-source-pack
          path: qa176-source-pack/
          if-no-files-found: error
          retention-days: 3
