name: QA 176 dark-logo rights audit

on:
  push:
    branches:
      - feat/issue-175-channel-expansion
    paths:
      - .github/workflows/qa-176-dark-logo-rights-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick unzip libimage-exiftool-perl
      - name: Inspect rights-safe source candidates
        shell: python
        run: |
          import html, json, os, re, subprocess, time, urllib.parse, urllib.request, zipfile
          from pathlib import Path

          OUT=Path("qa176-v3")
          OUT.mkdir()
          UA={"User-Agent":"Teevee-QA176-rights-audit/1.0"}
          COMMONS="https://commons.wikimedia.org/w/api.php"

          def get(url):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=90) as r:
              return r.read()

          def api(params):
            q=urllib.parse.urlencode({"format":"json","formatversion":"2",**params})
            return json.loads(get(COMMONS+"?"+q))

          def render(src, out, label):
            preview=out.with_suffix(".preview.png")
            if src.suffix.lower()==".svg":
              subprocess.run(["rsvg-convert","-w","1536","-o",str(preview),str(src)],check=True)
            else:
              subprocess.run(["convert",str(src),"-resize","1536x768>",str(preview)],check=True)
            card=out.with_suffix(".card.png")
            subprocess.run([
              "convert","-size","1400x440","xc:#10100F",str(preview),"-resize","1120x280>",
              "-gravity","center","-composite","-fill","white","-gravity","south","-pointsize","22",
              "-annotate","+0+20",label,str(card)
            ],check=True)
            return card

          # 1) Every historical RTL 2023 revision. These pages are PD-textlogo and sourced to RTL Nederland.
          rtl_dir=OUT/"rtl-history"; rtl_dir.mkdir()
          rtl_cards=[]
          for channel,title in {
            "nl-rtl-4":"File:RTL4 2023.svg","nl-rtl-5":"File:RTL5 2023.svg",
            "nl-rtl-7":"File:RTL7 2023.svg","nl-rtl-8":"File:RTL8 2023.svg",
            "nl-rtl-z":"File:RTLZ 2023.svg",
          }.items():
            data=api({"action":"query","titles":title,"prop":"imageinfo","iiprop":"url|timestamp|sha1|size","iilimit":"20"})
            infos=data.get("query",{}).get("pages",[{}])[0].get("imageinfo",[])
            for idx,info in enumerate(infos):
              url=info["url"]; ts=info.get("timestamp","").replace(":","").replace("-","")
              p=rtl_dir/f"{channel}__{idx:02d}__{ts}.svg"
              p.write_bytes(get(url))
              rtl_cards.append(str(render(p,p, f"{channel} | {info.get('timestamp')} | {info.get('width')}x{info.get('height')} | sha1 {info.get('sha1')}")))
              time.sleep(1.5)
          if rtl_cards:
            subprocess.run(["montage",*rtl_cards,"-tile","2x","-geometry","+12+12",str(OUT/"rtl-history-contact-sheet.png")],check=True)

          # 2) Official Paramount Comedy Central logo package.
          cc_zip=OUT/"Comedy-Central_Logos.zip"
          cc_zip.write_bytes(get("https://paramount-presse.de/wp-content/uploads/2022/10/Comedy-Central_Logos.zip"))
          cc_dir=OUT/"comedy-central-official"; cc_dir.mkdir()
          with zipfile.ZipFile(cc_zip) as z:
            z.extractall(cc_dir)
          (OUT/"comedy-central-official-files.txt").write_text("\n".join(sorted(str(p.relative_to(cc_dir)) for p in cc_dir.rglob("*") if p.is_file())))
          cc_cards=[]
          for p in cc_dir.rglob("*"):
            if p.is_file() and p.suffix.lower() in {".svg",".png"}:
              try: cc_cards.append(str(render(p,p, "Paramount official | "+str(p.relative_to(cc_dir)))))
              except Exception as e: print("CC render skip",p,e)
          if cc_cards:
            subprocess.run(["montage",*cc_cards,"-tile","2x","-geometry","+12+12",str(OUT/"comedy-central-official-contact-sheet.png")],check=True)

          # 3) Official Ziggo Sport press-kit 402-406, Orange and White horizontal.
          zig_dir=OUT/"ziggo-official"; zig_dir.mkdir()
          zig={
            "nl-ziggo-sport-2-orange":"https://d21buns5ku92am.cloudfront.net/69874/images/638849-Ziggo%20Sport%20402%20Orange%20RGB%20v1-754a8a-original-1768301437.png?download=1",
            "nl-ziggo-sport-3-orange":"https://d21buns5ku92am.cloudfront.net/69874/images/638850-Ziggo%20Sport%20403%20Orange%20RGB%20v1-7f8ed4-original-1768301437.png?download=1",
            "nl-ziggo-sport-4-orange":"https://d21buns5ku92am.cloudfront.net/69874/images/638854-Ziggo%20Sport%20404%20Orange%20RGB%20v1-b0022d-original-1768301437.png?download=1",
            "nl-ziggo-sport-5-orange":"https://d21buns5ku92am.cloudfront.net/69874/images/638852-Ziggo%20Sport%20405%20Orange%20RGB%20v1-cafafc-original-1768301437.png?download=1",
            "nl-ziggo-sport-6-orange":"https://d21buns5ku92am.cloudfront.net/69874/images/638853-Ziggo%20Sport%20406%20Orange%20RGB%20v1-9371e4-original-1768301437.png?download=1",
            "nl-ziggo-sport-2-white":"https://d21buns5ku92am.cloudfront.net/69874/images/638871-Ziggo%20Sport%20402%20White%20RGB%20v1-92ddae-original-1768301450.png?download=1",
            "nl-ziggo-sport-3-white":"https://d21buns5ku92am.cloudfront.net/69874/images/638874-Ziggo%20Sport%20403%20White%20RGB%20v1-3a8b49-original-1768301450.png?download=1",
            "nl-ziggo-sport-4-white":"https://d21buns5ku92am.cloudfront.net/69874/images/638872-Ziggo%20Sport%20404%20White%20RGB%20v1-a6f0c3-original-1768301450.png?download=1",
            "nl-ziggo-sport-5-white":"https://d21buns5ku92am.cloudfront.net/69874/images/638875-Ziggo%20Sport%20405%20White%20RGB%20v1-2a93dd-original-1768301450.png?download=1",
            "nl-ziggo-sport-6-white":"https://d21buns5ku92am.cloudfront.net/69874/images/638873-Ziggo%20Sport%20406%20White%20RGB%20v1-ee7240-original-1768301450.png?download=1",
          }
          zig_cards=[]
          for name,url in zig.items():
            p=zig_dir/(name+".png"); p.write_bytes(get(url))
            zig_cards.append(str(render(p,p,"Ziggo Sport official press kit | "+name)))
          subprocess.run(["montage",*zig_cards,"-tile","2x","-geometry","+12+12",str(OUT/"ziggo-official-contact-sheet.png")],check=True)

          # 4) PD/CC0 current source files for remaining brands; record actual source markup colors.
          commons_dir=OUT/"commons-current"; commons_dir.mkdir()
          titles={
            "nl-discovery":"Discovery Channel - Logo 2019.svg",
            "nl-eurosport-1":"Eurosport 1 Logo 2015.svg",
            "nl-eurosport-2":"Eurosport 2 Logo 2015.svg",
            "nl-national-geographic":"National Geographic Logo.svg",
            "nl-viaplay-tv":"Viaplay TV logo.svg",
            "nl-star-channel":"Star Channel 2023.svg",
            "nl-comedy-central":"Comedy Central 2018.svg",
          }
          meta=[]
          cards=[]
          for channel,title in titles.items():
            data=api({"action":"query","titles":"File:"+title,"prop":"imageinfo","iiprop":"url|timestamp|sha1|size|extmetadata","iilimit":"1"})
            info=data.get("query",{}).get("pages",[{}])[0].get("imageinfo",[{}])[0]
            url=info.get("url")
            if not url: continue
            ext=".svg" if info.get("mime")=="image/svg+xml" or url.lower().split("?")[0].endswith(".svg") else ".png"
            p=commons_dir/(channel+ext); p.write_bytes(get(url))
            cards.append(str(render(p,p,channel+" | Commons "+title)))
            em=info.get("extmetadata",{})
            meta.append({
              "channel":channel,"title":title,"url":url,"sha1":info.get("sha1"),
              "timestamp":info.get("timestamp"),
              "license":(em.get("LicenseShortName") or {}).get("value"),
              "licenseUrl":(em.get("LicenseUrl") or {}).get("value"),
              "artist":(em.get("Artist") or {}).get("value"),
              "credit":(em.get("Credit") or {}).get("value"),
            })
            time.sleep(1.5)
          (OUT/"commons-current-metadata.json").write_text(json.dumps(meta,indent=2))
          if cards:
            subprocess.run(["montage",*cards,"-tile","2x","-geometry","+12+12",str(OUT/"commons-current-contact-sheet.png")],check=True)

          # 5) Compare all candidate bytes with current dark SHA-256.
          subprocess.run("sha256sum assets/channels/dark/*.png > qa176-v3/current-dark-sha256.txt",shell=True,check=True)
          subprocess.run("find qa176-v3 -type f \( -name '*.png' -o -name '*.svg' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > qa176-v3/candidate-sha256.txt",shell=True,check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: qa176-dark-logo-rights-audit-v3
          path: qa176-v3/
          if-no-files-found: error
          retention-days: 3
