name: QA 176 finalize dark-logo rights fix

on:
  push:
    branches: [feat/issue-175-channel-expansion]
    paths: [.github/workflows/qa-176-dark-logo-rights-audit.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-175-channel-expansion
          fetch-depth: 0

      - name: Install temporary image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate rights-safe fixed dark assets and close documentation
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import hashlib
          import os
          import re
          import urllib.request

          ROOT = Path(".")
          ASSETS = ROOT / "assets/channels"
          DARK = ASSETS / "dark"
          AUDIT = ROOT / ".qa176-final-audit"
          AUDIT.mkdir(exist_ok=True)

          DERIVED_IDS = [
              "nl-rtl-4",
              "nl-rtl-5",
              "nl-rtl-7",
              "nl-rtl-8",
              "nl-star-channel",
              "nl-viaplay-tv",
              "nl-rtl-z",
              "nl-comedy-central",
              "nl-eurosport-1",
              "nl-eurosport-2",
              "nl-discovery",
              "nl-national-geographic",
          ]
          ZIGGO_URLS = {
              "nl-ziggo-sport-2": "https://d21buns5ku92am.cloudfront.net/69874/images/638906-Ziggo%20Sport%20402%20White%20Horizontal%20RGB%20v1-3a54d1-original-1768301467.png?download=1",
              "nl-ziggo-sport-3": "https://d21buns5ku92am.cloudfront.net/69874/images/638905-Ziggo%20Sport%20403%20White%20Horizontal%20RGB%20v1-2e3d9a-original-1768301467.png?download=1",
              "nl-ziggo-sport-4": "https://d21buns5ku92am.cloudfront.net/69874/images/638904-Ziggo%20Sport%20404%20White%20Horizontal%20RGB%20v1-ce7552-original-1768301467.png?download=1",
              "nl-ziggo-sport-5": "https://d21buns5ku92am.cloudfront.net/69874/images/638907-Ziggo%20Sport%20405%20White%20Horizontal%20RGB%20v1-8bf0fd-original-1768301467.png?download=1",
              "nl-ziggo-sport-6": "https://d21buns5ku92am.cloudfront.net/69874/images/638909-Ziggo%20Sport%20406%20White%20Horizontal%20RGB%20v1-b1fefb-original-1768301467.png?download=1",
          }
          ZIGGO_LABELS = {
              "nl-ziggo-sport-2": "Ziggo Sport 402 White Horizontal RGB v1",
              "nl-ziggo-sport-3": "Ziggo Sport 403 White Horizontal RGB v1",
              "nl-ziggo-sport-4": "Ziggo Sport 404 White Horizontal RGB v1",
              "nl-ziggo-sport-5": "Ziggo Sport 405 White Horizontal RGB v1",
              "nl-ziggo-sport-6": "Ziggo Sport 406 White Horizontal RGB v1",
          }
          DARK_IDS = [
              "nl-rtl-4",
              "nl-rtl-5",
              "nl-rtl-7",
              "nl-rtl-8",
              "nl-star-channel",
              "nl-ziggo-sport-2",
              "nl-ziggo-sport-3",
              "nl-ziggo-sport-4",
              "nl-ziggo-sport-5",
              "nl-ziggo-sport-6",
              "nl-viaplay-tv",
              "nl-rtl-z",
              "nl-comedy-central",
              "nl-eurosport-1",
              "nl-eurosport-2",
              "nl-discovery",
              "nl-national-geographic",
          ]

          def transform(cid, px):
              r, g, b, a = px
              if a == 0:
                  return px
              if r > 235 and g > 235 and b > 235:
                  return px
              if cid.startswith("nl-rtl-"):
                  if max(r, g, b) < 90:
                      return (255, 255, 255, a)
                  return px
              if cid == "nl-comedy-central":
                  if max(r, g, b) < 100:
                      return (255, 255, 255, a)
                  return px
              if cid == "nl-discovery":
                  if max(r, g, b) < 220:
                      return (255, 255, 255, a)
                  return px
              if cid.startswith("nl-eurosport-"):
                  if r > 140 and r > g * 1.5 and r > b * 1.3:
                      return px
                  if max(r, g, b) < 180:
                      return (255, 255, 255, a)
                  return px
              if cid == "nl-national-geographic":
                  if b < 80 and r > 170 and g > 140:
                      return px
                  if max(r, g, b) < 150:
                      return (255, 255, 255, a)
                  return px
              if cid == "nl-viaplay-tv":
                  mx = max(r, g, b)
                  mn = min(r, g, b)
                  if mx - mn < 55 and mx < 210:
                      return (255, 255, 255, a)
                  if max(r, g, b) < 95:
                      return (255, 255, 255, a)
                  return px
              if cid == "nl-star-channel":
                  if max(r, g, b) < 130:
                      return (255, 255, 255, a)
                  return px
              raise AssertionError(f"Unexpected derived id: {cid}")

          # 12 fixed Teevee-owned dark raster derivatives from already vendored
          # PD/CC0 source geometry. Only neutral/dark wordmark pixels change;
          # alpha, geometry and brand accent colours stay source-derived.
          for cid in DERIVED_IDS:
              source = ASSETS / f"{cid}.png"
              image = Image.open(source).convert("RGBA")
              image.putdata([transform(cid, px) for px in image.getdata()])
              image.save(DARK / f"{cid}.png", optimize=True)

          # Five broadcaster-supplied exact PNGs from the Ziggo Sport Newsroom.
          for cid, url in ZIGGO_URLS.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Teevee-PR176-rights-fix/1.0"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  data = response.read()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), cid
              (DARK / f"{cid}.png").write_bytes(data)

          hashes = {}
          for cid in DARK_IDS:
              path = DARK / f"{cid}.png"
              data = path.read_bytes()
              hashes[cid] = hashlib.sha256(data).hexdigest()
              image = Image.open(path)
              width, height = image.size
              assert width > 0 and height > 0
              source_pixels_per_point = 1 / min(40 / width, 32 / height)
              assert source_pixels_per_point >= 3, (cid, image.size, source_pixels_per_point)

          # Rebuild SHA256SUMS in canonical filename order while keeping all 49 base bytes unchanged.
          sums_path = ASSETS / "SHA256SUMS"
          entries = {}
          for line in sums_path.read_text().splitlines():
              if not line.strip():
                  continue
              digest, filename = line.split("  ", 1)
              entries[filename] = digest
          for cid, digest in hashes.items():
              entries[f"dark/{cid}.png"] = digest
          assert len(entries) == 66, len(entries)
          assert sum(1 for name in entries if name.startswith("dark/")) == 17
          sums_path.write_text("".join(f"{entries[name]}  {name}\n" for name in sorted(entries)))

          # Durable rights/provenance closeout.
          logo_doc = ROOT / "docs/CHANNEL_LOGO_ASSETS.md"
          text = logo_doc.read_text()
          text = text.replace(
              "Status: **ACTIVE LOCAL RASTER ASSET REGISTRY — PR #176 CANDIDATE**",
              "Status: **ACTIVE LOCAL RASTER ASSET REGISTRY — PR #176 QA-FIX CANDIDATE**",
              1,
          )
          text = text.replace(
              "| `nl-national-geographic` | National Geographic | `assets/channels/nl-national-geographic.png` | `6503b9c317270343d4c81f5f887837725b820743c59328d7b3a4422956bd267a` | National Geographic Society | https://commons.wikimedia.org/wiki/File:National_Geographic_Logo.svg | Commons file terms / trademark |",
              "| `nl-national-geographic` | National Geographic | `assets/channels/nl-national-geographic.png` | `6503b9c317270343d4c81f5f887837725b820743c59328d7b3a4422956bd267a` | National Geographic Society | https://commons.wikimedia.org/wiki/File:National_Geographic_Logo.svg | PD-textlogo / trademark |",
              1,
          )
          dark_start = text.index("## Dark-safe broadcaster-specific variants")
          visual_start = text.index("## Visual risks that still require physical iPhone acceptance")
          rows = []
          rights = {
              "nl-rtl-4": "Teevee fixed dark raster from base row; source work PD/simple-logo",
              "nl-rtl-5": "Teevee fixed dark raster from base row; source work PD/simple-logo",
              "nl-rtl-7": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-rtl-8": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-rtl-z": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-comedy-central": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-discovery": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-eurosport-1": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-eurosport-2": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-national-geographic": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-viaplay-tv": "Teevee fixed dark raster from base row; source work PD-textlogo",
              "nl-star-channel": "Teevee fixed dark raster from base row; source work CC0 1.0",
          }
          for cid in DARK_IDS:
              asset = f"`assets/channels/dark/{cid}.png`"
              digest = f"`{hashes[cid]}`"
              if cid in ZIGGO_URLS:
                  source = f"Ziggo Sport Newsroom — {ZIGGO_LABELS[cid]}"
                  basis = "Exact broadcaster-supplied PNG; no third-party derivative/pack rights"
              else:
                  source = f"`assets/channels/{cid}.png` + fixed Teevee dark-raster transform"
                  basis = rights[cid]
              rows.append(f"| `{cid}` | {asset} | {digest} | {source} | {basis} |")

          new_dark = """## Dark-safe broadcaster-specific variants

          Owner physical review #5833155116 established that 17 light/base marks lose required contrast on the accepted dark Guide canvas. Independent QA review #5320776684 then rejected the prior dark-file byte provenance because permission to use a broadcaster mark does not by itself establish commercial redistribution rights in a third-party pack's exact PNG bytes.

          The QA fix uses **Pad B — asset replacement**. All 17 prior dark PNG bytes are replaced. The runtime architecture is unchanged: the central canonical-ID keyed manifest/registry still resolves a fixed local PNG for dark appearance, with no runtime tint, recolour, hotlink, generic tile or per-screen mapping.

          The rights chain is deliberately split:

          - **Broadcaster mark / trademark authority:** Teevee's existing owner-confirmed rights authority remains the basis for using the broadcaster identities. That authority is separate from, and is not inferred from, Commons or a press portal.
          - **Exact dark-file byte/copyright authority:** twelve dark PNGs are fixed Teevee-generated raster derivatives of the already-vendored base assets whose underlying source works are recorded above as PD-textlogo/simple-logo or CC0; five Ziggo Sport PNGs are exact files supplied by Ziggo Sport in its public Newsroom logo press kit. No current dark byte is copied from a third-party logo pack.

          For the twelve Teevee-generated dark rasters, the transform is build-time and finite: geometry, alpha and broadcaster accent colours remain source-derived; only neutral/dark wordmark pixels are lifted to white for the accepted dark canvas. The generated PNG bytes are vendored and hash-locked. There is no runtime colour transformation and no generator/tooling dependency in the production tree.

          Ziggo source page: https://www.ziggosport.nl/nieuws/assets/238870/

          | Canonical ID | Dark asset | SHA-256 | Concrete byte/source chain | Copyright / file-rights basis |
          | --- | --- | --- | --- | --- |
          """ + "\n".join(rows) + """

          ## Integrity contract

          - exactly 49 canonical IDs have exactly 49 light/base local PNG paths;
          - 17 owner-identified dark-contrast IDs have explicit dark-safe PNG variants;
          - every PNG filename is canonical-ID keyed;
          - `SHA256SUMS` contains all 66 runtime PNG byte hashes (49 base + 17 dark);
          - CI verifies manifest order, file existence, byte hashes, PNG signature and minimum intrinsic density for the smallest 40x32 identity box;
          - the final tree contains no dark-logo download/generator workflow or asset-conversion dependency;
          - `react-native-svg` is not required by the final raster-only runtime;
          - provider `logoUrl` remains a generic fallback only for non-canonical/fixture identities. Canonical 49-channel rendering resolves local assets first.

          """
          text = text[:dark_start] + new_dark + text[visual_start:]
          old_boundary = "Local availability and technical provenance do not establish commercial redistribution rights for programme data, artwork or trademarks. The existing production rights/provider/SLA gate remains separate."
          new_boundary = "For these 17 dark files, the repository now records a byte/copyright provenance that does not depend on a third-party logo pack: twelve are Teevee-authored fixed raster derivatives of copyright-unrestricted PD/CC0 source works and five are exact broadcaster-supplied Ziggo Sport newsroom PNGs. Broadcaster/trademark use remains governed by the separate existing Teevee rights authority; it is not inferred from Commons or press-kit availability. Programme-data, programme-artwork and provider/SLA rights remain separate release gates."
          assert old_boundary in text
          text = text.replace(old_boundary, new_boundary, 1)
          assert "tv-logo/tv-logos" not in text
          logo_doc.write_text(text)

          # Status closeout: earlier physical PASS is historical but no longer covers the replaced logo bytes.
          impl = ROOT / "docs/CHANNEL_EXPANSION_IMPLEMENTATION_2026-09-24.md"
          text = impl.read_text()
          text = re.sub(
              r"^Status: .*?$",
              "Status: **INDEPENDENT QA RIGHTS FIX APPLIED — FOCUSED PHYSICAL LOGO REVALIDATION REQUIRED — NOT PRODUCTION-ACTIVATED**",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          old = "Provenance and byte hashes for all 49 base PNGs plus 17 dark variants are recorded directly in `docs/CHANNEL_LOGO_ASSETS.md`. Physical dark/system re-acceptance remains required; automated byte integrity is not a visual PASS. The dark alternates come from a pinned curated dark-background logo source and are copied byte-for-byte; they are not generated or recoloured by Teevee."
          new = "Provenance and byte hashes for all 49 base PNGs plus 17 dark variants are recorded directly in `docs/CHANNEL_LOGO_ASSETS.md`. Independent QA review #5320776684 required replacement of the earlier 17 dark-file bytes because their third-party redistribution basis was insufficient for a paid app. The replacement set removes that byte chain: twelve fixed dark rasters are Teevee-generated from PD/CC0 base-source works, and five Ziggo Sport dark marks are exact broadcaster-supplied Newsroom PNGs. Runtime still performs no tint/recolour. Because all 17 dark bytes changed, owner physical PASS #5836719484 remains valid for the non-logo 49-channel journeys but is **not** a logo PASS for this head; focused dark/system logo revalidation is required before Independent QA re-review."
          assert old in text
          text = text.replace(old, new, 1)
          marker = "## Required physical iPhone validation"
          assert marker in text
          text = text.replace(
              marker,
              "## Required physical iPhone validation\n\nOwner physical PASS #5836719484 covered the pre-QA-fix candidate. Since the Independent QA rights fix replaces all 17 dark asset bytes, the next physical gate is deliberately focused on the changed visual surface: dark mode, System appearance, Per zender, Nu & Straks, Totaal, Search, Mijn zenders and relevant Larger Text contexts, checking clipping, contrast, visible background boxes and broadcaster identity. Previously accepted non-logo #176 behavior is not reopened.",
              1,
          )
          impl.write_text(text)

          personal = ROOT / "docs/CHANNEL_PERSONALISATION.md"
          text = personal.read_text()
          text = re.sub(
              r"^Status: .*?$",
              "Status: **MERGED AND CANONICAL — issue #170 / PR #173**  ",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          personal.write_text(text)

          state = ROOT / "docs/PROJECT_STATE.md"
          text = state.read_text()
          lines = text.splitlines()
          def replace_prefix(prefix, replacement):
              matches = [i for i,line in enumerate(lines) if line.startswith(prefix)]
              assert len(matches) == 1, (prefix, matches)
              lines[matches[0]] = replacement
          replace_prefix(
              "Current implementation priority:",
              "Current implementation priority: **Issue #175 / PR #176 — close Independent QA review #5320776684 by replacing the 17 dark-logo bytes with a paid-app-safe provenance chain, then run focused physical logo revalidation before QA re-review.**",
          )
          replace_prefix(
              "- **Active 49-channel expansion:**",
              "- **Active 49-channel expansion:** Issue #175 / PR #176 implements the exact owner-approved 49-channel set/order, explicit 36 NL + 13 BE provider ownership, 12-day bounded multi-source refresh planning, deterministic 12→49 personalisation reconciliation and local canonical logo ownership. The earlier owner physical iPhone PASS #5836719484 accepted the 49-channel journeys on candidate `63430df9c9872f2b5a27185766ea443e05abde68`; Independent QA review #5320776684 then required a rights fix only for the 17 dark-logo file bytes. Pad B replaces all 17 dark bytes while preserving the central manifest/registry and `__DEV__`-only `npm run start:physical49` transport. Because the bytes changed, focused physical dark/System logo revalidation is required before Independent QA re-review. Hosted capacity for group size 12 remains PASS; production activation remains **NOT PERFORMED**.",
          )
          replace_prefix(
              "**Complete the active issue #170 / PR #173",
              "**Complete the active Issue #175 / PR #176 rights-fix gate: exact-head CI → focused physical iPhone revalidation of the replaced 17 dark-logo bytes → Independent QA re-review → final merge gate. PR #173 is already merged/canonical. Do not activate production topology, cron or schema in this increment.**",
          )
          replace_prefix(
              "> Read `AGENTS.md`",
              "> Read `AGENTS.md`, this file, `docs/CHANNEL_LOGO_ASSETS.md`, `docs/CHANNEL_EXPANSION_IMPLEMENTATION_2026-09-24.md`, `docs/CHANNEL_PERSONALISATION.md`, ADR 0012 and ADR 0013 before changing the repository. Phase 4 and Phase 5 are CLOSED. Current owner priority is Issue #175 / PR #176: finish the Independent QA dark-logo rights fix, focused physical revalidation and QA re-review without reopening accepted 49-channel, Search, personalisation or orchestration contracts. Production activation remains a later explicit gate. Physical Android interaction validation remains deferred until Android hardware is available.",
          )
          state.write_text("\n".join(lines) + "\n")

          devlog = ROOT / "docs/DEVLOG.md"
          text = devlog.read_text()
          heading = "# Teevee Development Logboek\n"
          assert text.startswith(heading)
          entry = """
          ## 25 september 2026 — PR #176 Independent QA rights fix: all 17 dark-logo bytes replaced (Pad B)

          Independent QA review #5320776684 accepted the technical #176 contracts but blocked merge on the commercial redistribution basis of the 17 dark-mode PNG bytes. The earlier owner physical PASS #5836719484 established visual suitability of that pre-fix candidate, but broadcaster-mark approval did not prove rights in third-party-supplied PNG bytes.

          Development therefore chose **Pad B** without reopening the accepted runtime architecture. All 17 dark bytes are replaced while the canonical-ID keyed manifest/registry and light/dark/System resolver stay unchanged. Twelve fixed dark rasters are produced from Teevee's existing base assets whose underlying works are recorded as PD-textlogo/simple-logo or CC0; the transform preserves alpha, geometry and brand accents and lifts only neutral/dark wordmark pixels to white at build time. Ziggo Sport 2–6 use exact broadcaster-supplied White Horizontal RGB PNGs from the Ziggo Sport Newsroom press kit. The final production tree contains no acquisition/generator workflow, runtime tint/recolour, hotlink, generic tile or per-screen asset map. `assets/channels/SHA256SUMS` locks the new bytes and `docs/CHANNEL_LOGO_ASSETS.md` records the per-file source/right basis separately from broadcaster/trademark authority.

          Because every dark asset byte changed, #5836719484 is no longer a complete logo-PASS for the new head. The next gate is focused physical iPhone revalidation of dark mode and System appearance across Per zender, Nu & Straks, Totaal, Search and Mijn zenders plus relevant Larger Text contexts. Production topology/cron/schema activation remains untouched, and Independent QA re-review follows only after that focused physical PASS.

          """
          text = heading + entry + text[len(heading):]
          old_para = "Owner physical review #5833155116 passed light-mode branding but identified 17 marks whose base/light artwork loses wordmark/suffix contrast on the dark Guide canvas. PR #176 now resolves broadcaster-specific dark-safe PNG variants centrally through the existing manifest/registry; there is no tint, runtime recolour, generic tile or per-screen map. The 17 alternate bytes are pinned to an immutable curated dark-background source snapshot, visually/technically verified for this use, and added to SHA256SUMS/provenance. The mirror is technical provenance/transport, not an official broadcaster asset portal."
          replacement = "Owner physical review #5833155116 passed light-mode branding but identified 17 marks whose base/light artwork loses wordmark/suffix contrast on the dark Guide canvas. PR #176 resolves those IDs centrally through the existing manifest/registry with no runtime tint, recolour, generic tile or per-screen map. The first dark-byte candidate was later superseded by the Independent QA rights fix recorded above; current provenance and hashes are exclusively the replacement set in `docs/CHANNEL_LOGO_ASSETS.md`."
          assert old_para in text
          text = text.replace(old_para, replacement, 1)
          old_gate = "Production activation is still blocked by exact-head CI on the reconciled candidate, source-specific hosted NL/BE capacity evidence, physical iPhone 49-channel/logo validation and Independent QA. No production refresh/deployment/schema/cron mutation is part of this integration step."
          new_gate = "Source-specific hosted NL/BE capacity evidence and the earlier full 49-channel owner physical journey are complete. After the dark-byte rights replacement, production activation remains blocked by exact-head CI, focused physical logo revalidation, Independent QA re-review and the normal final release/deployment gate. No production refresh/deployment/schema/cron mutation is part of this Development fix."
          assert old_gate in text
          text = text.replace(old_gate, new_gate, 1)
          devlog.write_text(text)

          # Visual artifact for this run only; it is uploaded then removed before commit.
          font = ImageFont.load_default()
          cards = []
          for cid in DARK_IDS:
              image = Image.open(DARK / f"{cid}.png").convert("RGBA")
              scale = min(520 / image.width, 180 / image.height, 1.0)
              display = image.resize(
                  (max(1, int(image.width * scale)), max(1, int(image.height * scale))),
                  Image.Resampling.LANCZOS,
              )
              card = Image.new("RGBA", (620, 250), (16, 16, 15, 255))
              card.alpha_composite(display, ((620 - display.width)//2, (200 - display.height)//2))
              ImageDraw.Draw(card).text((12, 220), cid, fill=(255,255,255,255), font=font)
              cards.append(card.convert("RGB"))
          sheet = Image.new("RGB", (1240, ((len(cards)+1)//2)*250), (16,16,15))
          for i, card in enumerate(cards):
              sheet.paste(card, ((i % 2)*620, (i // 2)*250))
          sheet.save(AUDIT / "dark-contact-sheet.png")
          (AUDIT / "dark-sha256.txt").write_text(
              "".join(f"{hashes[cid]}  dark/{cid}.png\n" for cid in DARK_IDS)
          )

          # Final tree must contain no temporary audit workflow.
          workflow = ROOT / ".github/workflows/qa-176-dark-logo-rights-audit.yml"
          workflow.unlink()
          assert not workflow.exists()

      - name: Verify final fixed asset contract
        run: |
          set -eux
          test "$(find assets/channels -maxdepth 1 -name '*.png' | wc -l)" -eq 49
          test "$(find assets/channels/dark -maxdepth 1 -name '*.png' | wc -l)" -eq 17
          test "$(wc -l < assets/channels/SHA256SUMS)" -eq 66
          ! grep -R "tv-logo/tv-logos" docs/CHANNEL_LOGO_ASSETS.md
          ! test -e .github/workflows/qa-176-dark-logo-rights-audit.yml
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: pr176-final-dark-logo-audit
          path: .qa176-final-audit/
          if-no-files-found: error
          retention-days: 7

      - name: Commit production-clean QA fix
        run: |
          set -eux
          rm -rf .qa176-final-audit
          git config user.name "teevee-qa-fix"
          git config user.email "159496541+zuiderwijk@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix dark logo redistribution provenance"
          git push origin HEAD:feat/issue-175-channel-expansion
