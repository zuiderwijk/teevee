name: QA 176 dark-logo rights audit

on:
  push:
    branches:
      - feat/issue-175-channel-expansion
    paths:
      - .github/workflows/qa-176-dark-logo-rights-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick unzip
      - name: Build current dark contact sheet
        run: |
          mkdir -p qa176-v2/current/cards qa176-v2/candidates
          for f in assets/channels/dark/*.png; do
            n="$(basename "$f" .png)"
            convert -size 1200x400 xc:'#10100F' "$f" -resize '960x250>' -gravity center -composite -fill white -gravity south -pointsize 22 -annotate +0+18 "$n | current PR dark asset" "qa176-v2/current/cards/$n.png"
          done
          montage qa176-v2/current/cards/*.png -tile 2x -geometry +12+12 qa176-v2/current-dark-contact-sheet.png
          sha256sum assets/channels/dark/*.png > qa176-v2/current-dark-sha256.txt
      - name: Inspect official RTL logo collection
        run: |
          set -eux
          curl --fail --location --retry 3 --user-agent 'Teevee-QA176/1.0' 'https://company.rtl.com/.galleries/images/rtl-logos/RTL_Logo_Collection.zip' -o qa176-v2/rtl-official.zip
          mkdir -p qa176-v2/rtl-official
          unzip -q qa176-v2/rtl-official.zip -d qa176-v2/rtl-official
          find qa176-v2/rtl-official -type f -printf '%P\n' | sort > qa176-v2/rtl-official-files.txt
          grep -Ei 'rtl.?[4578z]|television|negative|white|weiss|black|schwarz' qa176-v2/rtl-official-files.txt > qa176-v2/rtl-official-relevant.txt || true
      - name: Inspect official Ziggo Sport press kit
        shell: python
        run: |
          import html, json, re, urllib.request
          from pathlib import Path
          out=Path("qa176-v2")
          url="https://www.ziggosport.nl/nieuws/assets/238870/"
          req=urllib.request.Request(url,headers={"User-Agent":"Teevee-QA176/1.0"})
          body=urllib.request.urlopen(req,timeout=60).read().decode("utf-8","replace")
          (out/"ziggo-official-page.html").write_text(body)
          urls=sorted(set(html.unescape(x).replace("\\/","/") for x in re.findall(r'https?[^"\'<> ]+',body)))
          wanted=[u for u in urls if any(s in u.lower() for s in ["402","403","404","405","406","zip","asset","download"])]
          (out/"ziggo-official-urls.json").write_text(json.dumps(wanted,indent=2))
          snippets=[]
          for needle in ["402 White Horizontal RGB v1","403 White Horizontal RGB v1","404 White Horizontal RGB v1","405 White Horizontal RGB v1","406 White Horizontal RGB v1"]:
            i=body.find(needle)
            snippets.append(body[max(0,i-1200):i+1200] if i>=0 else "NOT FOUND: "+needle)
          (out/"ziggo-official-snippets.txt").write_text("\n\n=====\n\n".join(snippets))
          print("\n".join(wanted[:100]))
      - name: Acquire concrete Commons candidates
        shell: python
        run: |
          import subprocess, time, urllib.parse, urllib.request
          from pathlib import Path
          out=Path("qa176-v2/candidates")
          out.mkdir(parents=True,exist_ok=True)
          titles={
            "nl-rtl-4":"RTL4 2023.svg",
            "nl-rtl-5":"RTL5 2023.svg",
            "nl-rtl-7":"RTL7 2023.svg",
            "nl-rtl-8":"RTL8 2023.svg",
            "nl-rtl-z":"RTLZ 2023.svg",
            "nl-comedy-central":"Comedy Central HD.png",
            "nl-discovery":"Discovery Channel - Logo 2019.svg",
            "nl-eurosport-1":"Eurosport 1 HD Logo 2015.png",
            "nl-eurosport-2":"Eurosport 2 HD Logo 2015.png",
            "nl-national-geographic":"National Geographic Logo.svg",
            "nl-viaplay-tv":"Viaplay TV logo.svg",
            "nl-star-channel":"Star Channel 2023.svg",
            "nl-ziggo-sport-2":"Ziggo Sport 2.svg",
            "nl-ziggo-sport-3":"Ziggo Sport 3.svg",
            "nl-ziggo-sport-4":"Ziggo Sport 4.svg",
            "nl-ziggo-sport-5":"Ziggo Sport 5.svg",
            "nl-ziggo-sport-6":"Ziggo Sport 6.svg",
          }
          for channel,title in titles.items():
            ext=".png" if title.lower().endswith(".png") else ".svg"
            url="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+urllib.parse.quote(title,safe="")
            req=urllib.request.Request(url,headers={"User-Agent":"Teevee-QA176/1.0"})
            try:
              data=urllib.request.urlopen(req,timeout=60).read()
            except Exception as e:
              print(channel,title,e)
              time.sleep(2)
              continue
            src=out/(channel+ext)
            src.write_bytes(data)
            png=out/(channel+".preview.png")
            if ext==".svg":
              subprocess.run(["rsvg-convert","-w","1024","-o",str(png),str(src)],check=True)
            else:
              subprocess.run(["convert",str(src),"-resize","1024x512>",str(png)],check=True)
            card=out/(channel+".card.png")
            subprocess.run(["convert","-size","1200x400","xc:#10100F",str(png),"-resize","960x250>","-gravity","center","-composite","-fill","white","-gravity","south","-pointsize","22","-annotate","+0+18",channel+" | Commons candidate: "+title,str(card)],check=True)
            time.sleep(2)
          cards=sorted(str(p) for p in out.glob("*.card.png"))
          if cards:
            subprocess.run(["montage",*cards,"-tile","2x","-geometry","+12+12","qa176-v2/commons-contact-sheet.png"],check=True)
      - name: Record candidate hashes
        run: |
          find qa176-v2/candidates -type f ! -name '*.card.png' ! -name '*.preview.png' -print0 | sort -z | xargs -0 sha256sum > qa176-v2/commons-candidate-sha256.txt
          sha256sum qa176-v2/rtl-official.zip > qa176-v2/rtl-official-zip-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qa176-dark-logo-rights-audit-v2
          path: qa176-v2/
          if-no-files-found: error
          retention-days: 3
