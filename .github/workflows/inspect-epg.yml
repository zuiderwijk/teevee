name: Inspect temporary EPG

on:
  pull_request:
    paths:
      - .github/workflows/inspect-epg.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Netherlands XMLTV feed
        shell: python
        run: |
          import collections
          import urllib.request
          import xml.etree.ElementTree as ET

          url = "https://iptv-epg.org/files/epg-nl.xml"
          request = urllib.request.Request(url, headers={"User-Agent": "Teevee/0.1 development-inspector"})
          with urllib.request.urlopen(request, timeout=30) as response:
              body = response.read()
              content_type = response.headers.get("Content-Type")

          root = ET.fromstring(body)
          channels = []
          for element in root.findall("channel"):
              channel_id = element.attrib.get("id", "")
              display_name = element.findtext("display-name") or channel_id
              channels.append((channel_id, display_name))

          counts = collections.Counter()
          min_start = None
          max_stop = None
          for programme in root.findall("programme"):
              channel_id = programme.attrib.get("channel", "")
              if channel_id:
                  counts[channel_id] += 1
              start = programme.attrib.get("start")
              stop = programme.attrib.get("stop")
              if start and (min_start is None or start < min_start):
                  min_start = start
              if stop and (max_stop is None or stop > max_stop):
                  max_stop = stop

          needles = ("npo", "rtl", "sbs", "net5", "veronica", "espn", "ziggo", "discovery", "national geographic", "bbc", "canvas", "ketnet", "vtm")
          interesting = [item for item in channels if any(n in f"{item[0]} {item[1]}".lower() for n in needles)]

          print(f"url={url}")
          print(f"content_type={content_type}")
          print(f"bytes={len(body)}")
          print(f"channel_count={len(channels)}")
          print(f"programme_count={sum(counts.values())}")
          print(f"min_start={min_start}")
          print(f"max_stop={max_stop}")
          print("INTERESTING_CHANNELS")
          for channel_id, display_name in interesting:
              print(f"{channel_id}\t{display_name}\t{counts[channel_id]}")
          print("FIRST_CHANNELS")
          for channel_id, display_name in channels[:30]:
              print(f"{channel_id}\t{display_name}\t{counts[channel_id]}")
