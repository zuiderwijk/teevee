name: Tonight classification source probe

on:
  push:
    branches:
      - feat/tonight-classification-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current XMLTV structured evidence
        shell: python
        run: |
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          url = "https://iptv-epg.org/files/epg-nl.xml"
          with urllib.request.urlopen(url, timeout=30) as response:
              xml = response.read()
          root = ET.fromstring(xml)

          targets = {
              "The Grey",
              "Kursk",
              "I, Robot",
              "The Martian",
              "De pupil",
              "Billy Elliot",
              "Almost Famous",
              "Best Medicine",
              "Missie Aarde",
              "The Spencer Sisters",
              "Agatha Christie's Poirot",
              "Aspe",
              "Bluey",
              "Marvel's Spidey and His Amazing Friends",
              "NOS Jeugdjournaal",
              "Andere Tijden Sport",
              "NOS Voetbal",
              "UEFA Nations League Soccer",
              "NOS Studio Sport",
              "UCI Road World Championships",
          }

          channel_names = {}
          for channel in root.findall("channel"):
              channel_id = channel.attrib.get("id", "")
              display = channel.findtext("display-name") or channel_id
              channel_names[channel_id] = display.strip()

          rows = []
          all_category_counts = {}
          for programme in root.findall("programme"):
              title = (programme.findtext("title") or "").strip()
              categories = [
                  (category.text or "").strip()
                  for category in programme.findall("category")
                  if (category.text or "").strip()
              ]
              for category in categories:
                  all_category_counts[category] = all_category_counts.get(category, 0) + 1

              if title not in targets:
                  continue
              episode_nums = [
                  {"system": item.attrib.get("system"), "value": (item.text or "").strip()}
                  for item in programme.findall("episode-num")
              ]
              previously_shown = programme.find("previously-shown")
              rows.append({
                  "title": title,
                  "channel": channel_names.get(programme.attrib.get("channel", ""), programme.attrib.get("channel", "")),
                  "start": programme.attrib.get("start"),
                  "stop": programme.attrib.get("stop"),
                  "categories": categories,
                  "episodeNums": episode_nums,
                  "hasLive": programme.find("live") is not None,
                  "hasPreviouslyShown": previously_shown is not None,
                  "previouslyShownStart": None if previously_shown is None else previously_shown.attrib.get("start"),
                  "subtitle": (programme.findtext("sub-title") or "").strip(),
                  "description": re.sub(r"\s+", " ", (programme.findtext("desc") or "").strip())[:240],
              })

          print("SOURCE_BYTES", len(xml))
          print("TARGET_ROWS", len(rows))
          for row in rows:
              print("EVIDENCE", row)
          print("CATEGORY_COUNTS", sorted(all_category_counts.items(), key=lambda item: (-item[1], item[0]))[:120])
