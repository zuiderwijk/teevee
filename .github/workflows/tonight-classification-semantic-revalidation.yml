name: Tonight classification semantic revalidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create disposable exact-classifier probe
        shell: bash
        run: |
          cat > server/classification/__classificationSemanticRevalidation.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          import {
            isTonightFilmClassification,
            isTonightSeriesClassification,
            isTonightSportClassification,
          } from '../../data/domain/programmeClassification.ts';
          import { IPTV_EPG_NL_PROVIDER_CHANNEL_IDS } from '../epg/developmentChannelCatalog.ts';
          import {
            DEFAULT_DEVELOPMENT_XMLTV_URL,
            parseXmltvDocument,
          } from '../epg/xmltvProvider.ts';
          import { classifyExternalProgramme } from './classifyProgramme.ts';

          const EXPLICIT_SCRIPTED = new Set([
            'Dramaseries',
            'Misdaaddrama',
            'Sitcoms',
            'Soap',
            'Miniseries',
          ]);

          const BROAD_CONTEXT_BLOCKERS = new Set([
            "Auto's",
            'Beeldende Kunst',
            'Bouwen En Verbouwen',
            'Business & Financial',
            "Consumentenprogramma's",
            'Culinair',
            'Debat',
            'Dieren',
            'Doe Het Zelf',
            'Entertainment',
            'Exercise',
            'Geschiedenis',
            'Home & Garden',
            'Landbouw',
            'Mode',
            'Muziek',
            'Natuur',
            'Natuur En Milieu',
            'Politiek',
            'Reizen',
            'Religie',
            'Samenleving',
            'Shoppen',
            'Technologie',
            'Variété',
            'Veiling',
            'Wetenschap',
          ]);

          const TARGETS = new Set([
            'The Spencer Sisters',
            'Best Medicine',
            'Missie Aarde',
            "Agatha Christie's Poirot",
            'Aspe',
            'Sluipschutters',
            'The Yorkshire Vet',
            'LUBACH',
            'Beste Kijkers',
            'Het Interventie Team',
            'Top Gear',
          ]);

          function amsterdamHour(value: string): number {
            return Number(
              new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Europe/Amsterdam',
                hour: '2-digit',
                hour12: false,
              }).format(new Date(value)),
            );
          }

          function isTonight(value: string): boolean {
            const hour = amsterdamHour(value);
            return hour >= 19 || hour < 6;
          }

          function uniqueBy<T>(values: T[], key: (value: T) => string): T[] {
            return [...new Map(values.map((value) => [key(value), value])).values()];
          }

          describe('disposable live programme classification semantic revalidation', () => {
            it('runs the exact classifier against the current mapped source', async () => {
              const response = await fetch(DEFAULT_DEVELOPMENT_XMLTV_URL);
              expect(response.ok).toBe(true);
              const xml = await response.text();
              const document = parseXmltvDocument(xml);
              const mapped = new Set(IPTV_EPG_NL_PROVIDER_CHANNEL_IDS);

              const rows = document.programmes
                .map(({ programme }) => programme)
                .filter(
                  (programme) =>
                    programme.channelId &&
                    mapped.has(programme.channelId) &&
                    programme.startAt &&
                    isTonight(programme.startAt),
                )
                .map((programme, index) => ({
                  programme,
                  classification: classifyExternalProgramme({
                    providerKey: 'development-xmltv',
                    programmeId: `probe-${index}`,
                    programme,
                  }),
                }));

              const summary = rows.reduce(
                (result, row) => {
                  result.total += 1;
                  result.contentType[row.classification.contentType] =
                    (result.contentType[row.classification.contentType] ?? 0) + 1;
                  if (row.classification.contentType === 'series') result.semanticSeries += 1;
                  if (row.classification.contentType === 'unknown') result.unknown += 1;
                  if (isTonightFilmClassification(row.classification)) result.filmEligible += 1;
                  if (isTonightSeriesClassification(row.classification)) result.seriesEligible += 1;
                  if (isTonightSportClassification(row.classification)) result.sportEligible += 1;
                  return result;
                },
                {
                  total: 0,
                  filmEligible: 0,
                  seriesEligible: 0,
                  semanticSeries: 0,
                  sportEligible: 0,
                  unknown: 0,
                  contentType: {} as Record<string, number>,
                },
              );

              const genericSeries = uniqueBy(
                rows
                  .filter(
                    ({ classification, programme }) =>
                      isTonightSeriesClassification(classification) &&
                      !(programme.categories?.[0] &&
                        EXPLICIT_SCRIPTED.has(programme.categories[0])),
                  )
                  .map(({ programme }) => ({
                    title: programme.title,
                    categories: programme.categories,
                    episodeNumbers: programme.episodeNumbers,
                    hasDirectorCredit: programme.hasDirectorCredit,
                  })),
                (item) => `${item.title}\u0000${JSON.stringify(item.categories)}`,
              );

              const changedAmbiguities = uniqueBy(
                rows
                  .filter(
                    ({ classification, programme }) =>
                      classification.contentType === 'unknown' &&
                      (programme.categories ?? []).some((category) =>
                        BROAD_CONTEXT_BLOCKERS.has(category),
                      ),
                  )
                  .map(({ programme, classification }) => ({
                    title: programme.title,
                    categories: programme.categories,
                    episodeNumbers: programme.episodeNumbers,
                    hasDirectorCredit: programme.hasDirectorCredit,
                    contentType: classification.contentType,
                    confidence: classification.confidence,
                    description: programme.description?.slice(0, 180),
                  })),
                (item) => `${item.title}\u0000${JSON.stringify(item.categories)}`,
              );

              const targetRows = uniqueBy(
                rows
                  .filter(({ programme }) => TARGETS.has(programme.title ?? ''))
                  .map(({ programme, classification }) => ({
                    title: programme.title,
                    categories: programme.categories,
                    episodeNumbers: programme.episodeNumbers,
                    hasDirectorCredit: programme.hasDirectorCredit,
                    contentType: classification.contentType,
                    seriesType: classification.seriesType,
                    audience: classification.audience,
                    confidence: classification.confidence,
                    seriesEligible: isTonightSeriesClassification(classification),
                  })),
                (item) => `${item.title}\u0000${JSON.stringify(item.categories)}`,
              );

              const sportRows = uniqueBy(
                rows
                  .filter(({ classification }) => classification.contentType === 'sport')
                  .map(({ programme, classification }) => ({
                    title: programme.title,
                    categories: programme.categories,
                    sportType: classification.sportType,
                    confidence: classification.confidence,
                    eligible: isTonightSportClassification(classification),
                    description: programme.description?.slice(0, 180),
                  })),
                (item) =>
                  `${item.title}\u0000${item.sportType}\u0000${JSON.stringify(item.categories)}`,
              );

              const strongOther = rows.filter(
                ({ classification }) =>
                  classification.contentType === 'other' &&
                  classification.confidence === 'high',
              ).length;

              console.log('SEMANTIC_REVALIDATION_SOURCE_BYTES', xml.length);
              console.log('SEMANTIC_REVALIDATION_SUMMARY', JSON.stringify(summary));
              console.log('SEMANTIC_REVALIDATION_GENERIC_SERIES', JSON.stringify(genericSeries));
              console.log(
                'SEMANTIC_REVALIDATION_CHANGED_AMBIGUITIES',
                JSON.stringify({
                  count: changedAmbiguities.length,
                  rows: changedAmbiguities,
                }),
              );
              console.log('SEMANTIC_REVALIDATION_TARGETS', JSON.stringify(targetRows));
              console.log('SEMANTIC_REVALIDATION_SPORT', JSON.stringify(sportRows));
              console.log('SEMANTIC_REVALIDATION_STRONG_OTHER_ROWS', strongOther);

              expect(summary.total).toBeGreaterThan(0);
              expect(summary.filmEligible).toBeGreaterThan(0);
              expect(summary.seriesEligible).toBeGreaterThan(0);
              expect(strongOther).toBeGreaterThan(0);

              const sluipschutters = targetRows.find(
                (row) => row.title === 'Sluipschutters',
              );
              if (sluipschutters) {
                expect(sluipschutters).toMatchObject({
                  contentType: 'unknown',
                  confidence: 'unknown',
                  seriesEligible: false,
                });
              }
            }, 30_000);
          });
          EOF
      - name: Run exact implementation against live source
        run: npx vitest run server/classification/__classificationSemanticRevalidation.test.ts --reporter=verbose
