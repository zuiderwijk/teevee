name: Temporary Per-zender content-fit patch

on:
  push:
    branches:
      - feat/per-channel-fixed-row-convergence-v2
    paths:
      - .github/workflows/temporary-per-channel-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/per-channel-fixed-row-convergence-v2
      - name: Preserve three description lines above progress
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('features/guide/PerChannelGuideView.tsx')
          source = path.read_text()
          old = """      PER_CHANNEL_VISUAL_METRICS.progressHeight +\n      8,"""
          new = """      PER_CHANNEL_VISUAL_METRICS.progressHeight +\n      6,"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected one current-content gap expression, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/guide/PerChannelGuideView.tsx
          git commit -m "Fit three-line current programme description"
          git push origin HEAD:feat/per-channel-fixed-row-convergence-v2
