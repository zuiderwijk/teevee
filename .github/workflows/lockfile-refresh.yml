name: Temporary font lockfile refresh

on:
  push:
    branches:
      - feat/per-channel-fixed-row-convergence
    paths:
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/per-channel-fixed-row-convergence
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Add production font dependencies
        run: npm install --save-exact @expo-google-fonts/instrument-sans@0.4.2 expo-font@~57.0.4
      - name: Commit lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Instrument Sans runtime dependencies"
          git push origin HEAD:feat/per-channel-fixed-row-convergence
